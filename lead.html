<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Send Project Brief | AlterLabs</title>
  <meta name="description" content="Send AlterLabs your CRM, automation, dashboard, AI workflow or website project brief directly on WhatsApp." />
  <link rel="canonical" href="https://alterlabs.in/lead.html" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
<main class="article-page">
  <a class="article-back" href="index.html">/ back to AlterLabs</a>
  <p class="article-kicker">/ whatsapp lead pipeline</p>
  <h1>Send your system brief on WhatsApp</h1>
  <p class="article-summary">Use this form for CRM automation, AI workflows, dashboards, internal tools and website lead systems. It opens WhatsApp with your details prefilled.</p>
  <form class="form" id="labsLeadForm">
    <div class="form-row">
      <div class="field"><label>name</label><input name="name" required placeholder="your name"></div>
      <div class="field"><label>phone / whatsapp</label><input name="phone" required placeholder="+91..."></div>
    </div>
    <div class="form-row">
      <div class="field"><label>company</label><input name="company" placeholder="company name"></div>
      <div class="field"><label>scope</label><input name="scope" placeholder="CRM / AI workflow / dashboard"></div>
    </div>
    <div class="field"><label>budget</label><input name="budget" placeholder="budget range or open to discuss"></div>
    <div class="field"><label>brief</label><textarea name="brief" required placeholder="what are you trying to build, and what is getting in the way?"></textarea></div>
    <button class="btn btn-primary" type="submit">Send on WhatsApp</button>
  </form>
</main>
<script>
document.getElementById('labsLeadForm').addEventListener('submit', function(e) {
  e.preventDefault();
  const data = Object.fromEntries(new FormData(e.currentTarget).entries());
  const text = `AlterLabs project lead%0AName: ${data.name}%0APhone: ${data.phone}%0ACompany: ${data.company}%0AScope: ${data.scope}%0ABudget: ${data.budget}%0ABrief: ${data.brief}`;
  window.location.href = `https://wa.me/918826436093?text=${encodeURIComponent(text).replaceAll('%250A','%0A')}`;
});
</script>
</body>
</html>
