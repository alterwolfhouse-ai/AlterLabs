<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">AlterSync local video mixer</title>
  <desc id="desc">A neon blue and violet timeline interface by AlterLabs.</desc>
  <defs>
    <radialGradient id="glow" cx="50%" cy="40%" r="70%">
      <stop stop-color="#152553"/>
      <stop offset="1" stop-color="#050713"/>
    </radialGradient>
    <linearGradient id="neon" x1="180" y1="0" x2="1010" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#47d8ff"/>
      <stop offset="1" stop-color="#b55cff"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="24"/></filter>
