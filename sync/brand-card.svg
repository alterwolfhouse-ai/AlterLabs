  <rect width="1200" height="630" fill="url(#glow)"/>
  <path d="M120 475h960" stroke="url(#neon)" stroke-width="16" opacity=".22" filter="url(#blur)"/>
  <text x="120" y="218" fill="#f7f9ff" font-family="Arial, sans-serif" font-size="104" font-weight="700" letter-spacing="-4">AlterSync</text>
  <text x="124" y="286" fill="#91a4ca" font-family="Arial, sans-serif" font-size="30">LOCAL VIDEO + AUDIO MIXER</text>
  <rect x="120" y="350" width="960" height="76" rx="14" fill="#10182b" stroke="#263a62" stroke-width="2"/>
  <rect x="154" y="371" width="520" height="34" rx="8" fill="#215b8f"/>
  <rect x="694" y="371" width="352" height="34" rx="8" fill="#63358d"/>
  <path d="M724 348v80" stroke="#ff476f" stroke-width="5"/>
  <text x="120" y="535" fill="#dce8ff" font-family="Arial, sans-serif" font-size="26">No uploads  ·  No watermark  ·  Powered by AlterLabs</text>
